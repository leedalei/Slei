[package]
name = "slei-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slei-default-agent-assets = { path = "../../../crates/slei-default-agent-assets" }
tauri = { version = "2.11.2", features = ["macos-private-api"] }
thiserror = "2"
uuid.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
