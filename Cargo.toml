[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/adapter-api",
  "crates/slei-domain",
  "crates/slei-protocol",
  "crates/slei-storage",
  "crates/slei-daemon",
  "crates/slei-default-agent-assets",
  "crates/slei-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
futures = "0.3"
axum = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v4"] }
